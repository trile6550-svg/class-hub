<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ClassHub</title>

<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
    box-sizing: border-box;
}

:root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #f0f2f5;

    --text: #171717;
    --muted: #6b7280;

    --border: #d7dbe0;
    --grid: #e8ebef;

    --accent: #222222;
}


/* DARK MODE */

body.dark {
    --bg: #111111;
    --surface: #1b1b1b;
    --surface-2: #242424;

    --text: #f5f5f5;
    --muted: #a5a5a5;

    --border: #3a3a3a;
    --grid: #292929;

    --accent: #ffffff;
}


/* =====================================================
   BODY
===================================================== */

body {

    margin: 0;

    background: var(--bg);

    color: var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    transition:
        background 0.25s,
        color 0.25s;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar {

    height: 70px;

    background: var(--surface);

    border-bottom:
        1px solid var(--border);

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 28px;

    position: sticky;

    top: 0;

    z-index: 100;
}


.logo {

    font-size: 22px;

    font-weight: 700;

    letter-spacing: -0.5px;
}


.actions {

    display: flex;

    gap: 8px;
}


.btn {

    border:
        1px solid var(--border);

    background: var(--surface);

    color: var(--text);

    padding:
        9px 14px;

    border-radius: 8px;

    cursor: pointer;

    font-size: 14px;

    transition: 0.2s;
}


.btn:hover {

    background: var(--surface-2);

}


.btn.primary {

    background: var(--accent);

    color:
        var(--bg);

    border-color:
        var(--accent);
}


/* =====================================================
   PAGE
===================================================== */

.page {

    padding:
        30px;

    overflow-x: auto;
}


.classroom {

    width: 1400px;

    min-height: 1100px;

    margin:
        0 auto;

    padding:
        35px 45px;

    background-color:
        var(--surface);

    /*
       GIẤY Ô LY
    */

    background-image:

        linear-gradient(
            var(--grid) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            var(--grid) 1px,
            transparent 1px
        );

    background-size:
        20px 20px;

    border:
        1px solid var(--border);

    box-shadow:
        0 8px 30px rgba(0,0,0,0.08);

    position: relative;
}


/* =====================================================
   CLASSROOM HEADER
===================================================== */

.classroom-header {

    display: grid;

    grid-template-columns:
        1fr
        1fr
        1fr
        1fr;

    margin-bottom:
        45px;

    align-items:
        start;
}


/*
   BÀN GIÁO VIÊN
   nằm trước TỔ 1
*/

.teacher-area {

    grid-column:
        1;

    display: flex;

    justify-content:
        center;
}


.teacher {

    width: 190px;

    padding:
        13px;

    text-align:
        center;

    border:
        2px solid var(--text);

    background:
        var(--surface);

    font-size:
        14px;

    font-weight:
        700;
}


/*
   CỬA VÀO
   nằm trước TỔ 4
*/

.door-area {

    grid-column:
        4;

    display: flex;

    justify-content:
        center;
}


.door {

    width: 150px;

    padding:
        13px;

    text-align:
        center;

    border:
        2px solid var(--text);

    background:
        var(--surface);

    font-size:
        14px;

    font-weight:
        700;
}


/* =====================================================
   TITLE
===================================================== */

.title {

    text-align:
        center;

    margin-bottom:
        35px;
}


.title h1 {

    margin:
        0;

    font-size:
        28px;

    letter-spacing:
        1px;
}


.title p {

    margin:
        8px 0 0;

    color:
        var(--muted);

    font-size:
        13px;
}


/* =====================================================
   FOUR TEAMS
===================================================== */

.teams {

    display:
        grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap:
        20px;

    align-items:
        start;
}


/* =====================================================
   TEAM
===================================================== */

.team {

    min-width:
        0;

    padding:
        0 12px 25px;

    border-left:
        1px solid var(--border);

    border-right:
        1px solid var(--border);
}


.team-title {

    text-align:
        center;

    padding:
        12px 5px;

    margin-bottom:
        22px;

    border-bottom:
        2px solid var(--text);

    font-weight:
        700;

    font-size:
        17px;

    letter-spacing:
        1px;
}


/* =====================================================
   DESKS
===================================================== */

.desks {

    display:
        flex;

    flex-direction:
        column;

    gap:
        18px;
}


/* =====================================================
   ONE DESK
===================================================== */

.desk {

    background:
        var(--surface);

    border:
        1px solid var(--border);

    border-radius:
        6px;

    padding:
        9px;

    transition:
        0.2s;
}


.desk:hover {

    border-color:
        var(--text);

    box-shadow:
        0 3px 10px rgba(0,0,0,0.08);
}


.desk-number {

    font-size:
        10px;

    color:
        var(--muted);

    font-weight:
        700;

    margin-bottom:
        7px;

    text-align:
        center;
}


/*
   HAI HỌC SINH CẠNH NHAU
*/

.students {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        7px;
}


/* =====================================================
   STUDENT INPUT
===================================================== */

.student {

    width:
        100%;

    height:
        36px;

    border:
        1px solid var(--border);

    border-radius:
        5px;

    background:
        var(--surface-2);

    color:
        var(--text);

    padding:
        0 8px;

    font-size:
        12px;

    outline:
        none;
}


.student:focus {

    border-color:
        var(--text);

    background:
        var(--surface);
}


.student::placeholder {

    color:
        var(--muted);
}


/* =====================================================
   FOOTER
===================================================== */

.class-footer {

    display:
        flex;

    justify-content:
        space-between;

    margin-top:
        40px;

    color:
        var(--muted);

    font-size:
        12px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width: 1000px) {

    .page {

        padding:
            10px;

    }

    .classroom {

        margin:
            0;

    }

}


/* =====================================================
   PRINT
===================================================== */

@media print {

    .topbar {

        display:
            none;

    }

    body {

        background:
            white;

    }

    .page {

        padding:
            0;

    }

    .classroom {

        box-shadow:
            none;

        border:
            none;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     TOP BAR
===================================================== -->

<header class="topbar">

    <div class="logo">
        🎓 ClassHub
    </div>

    <div class="actions">

        <button
            class="btn"
            onclick="toggleDarkMode()"
            id="themeButton"
        >
            🌙 Dark
        </button>

        <button
            class="btn primary"
            onclick="saveClass()"
        >
            💾 Lưu
        </button>

        <button
            class="btn"
            onclick="window.print()"
        >
            🖨️ In
        </button>

    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="page">


<div class="classroom">


    <!-- =================================================
         TEACHER + DOOR
    ================================================== -->

    <div class="classroom-header">


        <!-- BÀN GIÁO VIÊN -->

        <div class="teacher-area">

            <div class="teacher">

                🧑‍🏫 BÀN GIÁO VIÊN

            </div>

        </div>


        <!-- Ô TRỐNG -->

        <div></div>

        <div></div>


        <!-- CỬA -->

        <div class="door-area">

            <div class="door">

                🚪 CỬA VÀO

            </div>

        </div>

    </div>



    <!-- =================================================
         TITLE
    ================================================== -->

    <div class="title">

        <h1>SƠ ĐỒ LỚP</h1>

        <p>
            Nhập tên học sinh vào từng vị trí
        </p>

    </div>



    <!-- =================================================
         FOUR TEAMS
    ================================================== -->

    <div class="teams">


        <!-- ==============================
             TỔ 1
        =============================== -->

        <section class="team">

            <div class="team-title">
                TỔ 1
            </div>

            <div
                class="desks"
                data-team="1"
            ></div>

        </section>



        <!-- ==============================
             TỔ 2
        =============================== -->

        <section class="team">

            <div class="team-title">
                TỔ 2
            </div>

            <div
                class="desks"
                data-team="2"
            ></div>

        </section>



        <!-- ==============================
             TỔ 3
        =============================== -->

        <section class="team">

            <div class="team-title">
                TỔ 3
            </div>

            <div
                class="desks"
                data-team="3"
            ></div>

        </section>



        <!-- ==============================
             TỔ 4
        =============================== -->

        <section class="team">

            <div class="team-title">
                TỔ 4
            </div>

            <div
                class="desks"
                data-team="4"
            ></div>

        </section>


    </div>



    <!-- =================================================
         FOOTER
    ================================================== -->

    <div class="class-footer">

        <span>
            ClassHub
        </span>

        <span>
            Sơ đồ lớp • 4 tổ
        </span>

    </div>


</div>


</main>



<script>

/* =====================================================
   TẠO 10 BÀN CHO MỖI TỔ
===================================================== */

function createDesks() {

    const allTeams =
        document.querySelectorAll(".desks");


    allTeams.forEach((team) => {

        for (
            let i = 1;
            i <= 10;
            i++
        ) {

            const desk =
                document.createElement("div");

            desk.className =
                "desk";


            desk.innerHTML = `

                <div class="desk-number">
                    BÀN ${String(i).padStart(2, "0")}
                </div>

                <div class="students">

                    <input
                        class="student"
                        placeholder="Học sinh 1"
                    >

                    <input
                        class="student"
                        placeholder="Học sinh 2"
                    >

                </div>

            `;


            team.appendChild(desk);

        }

    });

}


/* =====================================================
   LƯU DỮ LIỆU
===================================================== */

function saveClass() {

    const inputs =
        document.querySelectorAll(".student");

    const data = [];


    inputs.forEach((input) => {

        data.push(input.value);

    });


    localStorage.setItem(
        "classHubStudents",
        JSON.stringify(data)
    );


    alert(
        "✅ Đã lưu sơ đồ lớp!"
    );

}


/* =====================================================
   LOAD DỮ LIỆU
===================================================== */

function loadClass() {

    const saved =
        localStorage.getItem(
            "classHubStudents"
        );


    if (!saved) return;


    const data =
        JSON.parse(saved);


    const inputs =
        document.querySelectorAll(".student");


    inputs.forEach(
        (input, index) => {

            if (
                data[index] !== undefined
            ) {

                input.value =
                    data[index];

            }

        }
    );

}


/* =====================================================
   DARK MODE
===================================================== */

function toggleDarkMode() {

    document.body.classList.toggle(
        "dark"
    );


    const dark =
        document.body.classList.contains(
            "dark"
        );


    localStorage.setItem(
        "classHubDarkMode",
        dark
    );


    updateThemeButton();

}


/* =====================================================
   BUTTON DARK MODE
===================================================== */

function updateThemeButton() {

    const button =
        document.getElementById(
            "themeButton"
        );


    const dark =
        document.body.classList.contains(
            "dark"
        );


    if (dark) {

        button.innerHTML =
            "☀️ Light";

    } else {

        button.innerHTML =
            "🌙 Dark";

    }

}


/* =====================================================
   LOAD DARK MODE
===================================================== */

function loadTheme() {

    const dark =
        localStorage.getItem(
            "classHubDarkMode"
        );


    if (dark === "true") {

        document.body.classList.add(
            "dark"
        );

    }


    updateThemeButton();

}


/* =====================================================
   START
===================================================== */

createDesks();

loadClass();

loadTheme();

</script>


</body>
</html>
